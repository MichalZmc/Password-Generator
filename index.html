<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Password Generator</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="icon" type="image/png" href="icon.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=UnifrakturCook:wght@700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

<style>
  :root {
    --primary: #10b981;
    --bg: #080808;
    --card: #111111;
    --border: #222222;
  }

  body { 
    background-color: var(--bg);
    color: #f5f5f5;
    font-family: 'Inter', sans-serif;
    height: 100vh;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .main-card {
    background: var(--card);
    border: 1px solid var(--border);
    width: 100%;
    max-width: 440px;
    padding: 2.5rem;
    border-radius: 1.25rem;
    position: relative;
  }

  input[type="range"] {
    -webkit-appearance: none;
    width: 100%;
    height: 6px;
    background: var(--border);
    border-radius: 10px;
    outline: none;
    background-image: linear-gradient(var(--primary), var(--primary));
    background-repeat: no-repeat;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px;
    height: 18px;
    background: var(--primary);
    border-radius: 50%;
    cursor: pointer;
    border: 3px solid var(--card);
    box-shadow: 0 0 0 1px var(--primary);
    transition: transform 0.1s ease;
  }

  input[type="range"]::-webkit-slider-thumb:hover {
    transform: scale(1.2);
  }

  .option-btn {
    background: rgba(255, 255, 255, 0.02);
    border: 1px solid var(--border);
    padding: 0.65rem;
    border-radius: 0.75rem;
    font-size: 0.8rem;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    color: #666;
    font-weight: 500;
  }

  .option-btn.active {
    border-color: var(--primary);
    color: var(--primary);
    background: rgba(16, 185, 129, 0.08);
  }

  #passwordBox {
    font-family: 'JetBrains Mono', monospace;
    background: #0a0a0a;
    border: 1px solid var(--border);
    min-height: 4.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0.75rem 1rem;
    border-radius: 0.75rem;
    margin: 1.5rem 0;
    color: var(--primary);
    font-size: 1rem; 
    letter-spacing: -0.02em;
    white-space: nowrap; 
    overflow: hidden;
  }

  .btn-primary {
    background: var(--primary);
    color: #000;
    font-weight: 700;
    width: 100%;
    padding: 0.9rem;
    border-radius: 0.75rem;
    transition: all 0.2s;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-size: 0.85rem;
  }

  .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }

  .btn-copy {
    background: transparent;
    border: 1px solid var(--border);
    width: 100%;
    padding: 0.85rem;
    border-radius: 0.75rem;
    margin-top: 0.75rem;
    transition: all 0.2s;
    color: #888;
    font-size: 0.85rem;
  }

  .btn-copy:hover:not(:disabled) {
    border-color: #555;
    color: #fff;
  }

  #msln-sign {
    position:fixed;
    bottom:0.5rem; right:0.5rem;
    font-size:clamp(0.65rem,2.5vw,0.8rem);
    background:rgba(255,255,255,0.12);
    border:1px solid rgba(255,255,255,0.2);
    padding:3px 8px;
    border-radius:9999px;
    backdrop-filter:blur(8px);
    text-shadow:0 0 4px rgba(0,0,0,0.4);
    user-select:none;
    max-width:90vw;
    text-align:center;
    display:inline-flex;
    align-items:center;
    gap:4px;
    text-decoration:none;
    transition: all 0.3s ease;
  }
  #msln-sign .default-text { color:rgba(255,255,255,0.6); transition: color 0.3s ease; }
  #msln-sign .old { font-family:'UnifrakturCook',cursive; font-size:0.9rem; color:#ffffff; transition: color 0.3s ease; }
  #msln-sign .arrow { width:0.9rem; height:0.9rem; color:rgba(255,255,255,0.6); transition: color 0.3s ease; }
  #msln-sign:hover .default-text, #msln-sign:hover .arrow { color:#ffffff; }
  #msln-sign:hover .old { color:#10b981; }

  .flash-success { animation: flash 0.4s ease-out; }
  @keyframes flash { 0% { background: rgba(16,185,129,0.1); } 100% { background: transparent; } }

  @media (max-width: 768px) {
    .main-card {
      max-width: 95%;
      padding: 1.5rem;
    }
  }
</style>
</head>

<body>

  <div class="main-card">
    <div class="mb-8">
      <h1 class="text-sm font-bold tracking-[0.2em] text-neutral-500 uppercase text-center">Password Generator</h1>
    </div>

    <div class="mb-8">
      <div class="flex justify-between items-center mb-4">
        <span class="text-[10px] uppercase tracking-widest text-neutral-600 font-bold">Length</span>
        <span id="lengthDisplay" class="text-primary font-mono text-xl">16</span>
      </div>
      <input type="range" id="length" min="6" max="32" value="16">
    </div>

    <div class="grid grid-cols-2 gap-3 mb-8">
      <button data-type="lower" class="option-btn active">abc</button>
      <button data-type="upper" class="option-btn active">ABC</button>
      <button data-type="num" class="option-btn active">123</button>
      <button data-type="sym" class="option-btn active">@#$</button>
    </div>

    <button id="generateBtn" class="btn-primary">Generate</button>

    <div id="passwordBox"></div>

    <button id="copyBtn" class="btn-copy opacity-0 pointer-events-none">
      <i class="fa-regular fa-copy mr-2"></i> Copy to clipboard
    </button>
  </div>

  <a id="msln-sign" href="https://t.me/msln777" target="_blank" class="flex items-center gap-1 group">
    <span class="default-text">created by</span>
    <span class="old">@msln</span>
    <svg class="arrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 17L17 7" /><path d="M7 7h10v10" />
    </svg>
  </a>

<script>
const lengthInput = document.getElementById('length');
const lengthDisplay = document.getElementById('lengthDisplay');
const passwordBox = document.getElementById('passwordBox');
const generateBtn = document.getElementById('generateBtn');
const copyBtn = document.getElementById('copyBtn');

const charsets = {
  lower: "abcdefghijklmnopqrstuvwxyz",
  upper: "ABCDEFGHIJKLMNOPQRSTUVWXYZ",
  num: "0123456789",
  sym: "!@#$%^&*()_+[]{}|;:,.<>?/"
};

let options = { lower: true, upper: true, num: true, sym: true };
let typingInterval = null;

function updateSliderBackground() {
  const min = lengthInput.min;
  const max = lengthInput.max;
  const val = lengthInput.value;
  const percentage = (val - min) * 100 / (max - min);
  lengthInput.style.backgroundSize = percentage + '% 100%';
}

document.querySelectorAll(".option-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    const type = btn.getAttribute("data-type");
    options[type] = !options[type];
    btn.classList.toggle("active", options[type]);
    generatePassword();
  });
});

function generatePassword() {
  if(typingInterval) { clearInterval(typingInterval); typingInterval = null; }
  passwordBox.textContent = "";
  
  let chars = "";
  if(options.lower) chars += charsets.lower;
  if(options.upper) chars += charsets.upper;
  if(options.num) chars += charsets.num;
  if(options.sym) chars += charsets.sym;

  if(chars.length === 0) {
    passwordBox.innerHTML = `<span class="text-neutral-700 text-[11px] uppercase">Wybierz parametry</span>`;
    copyBtn.classList.add('opacity-0', 'pointer-events-none');
    return;
  }

  const length = +lengthInput.value;
  lengthDisplay.textContent = length;
  passwordBox.style.fontSize = length > 26 ? "0.9rem" : "1.05rem";

  let password = "";
  for(let i = 0; i < length; i++) {
    password += chars[Math.floor(Math.random() * chars.length)];
  }

  copyBtn.classList.remove('opacity-0', 'pointer-events-none');

  let i = 0;
  typingInterval = setInterval(() => {
    passwordBox.textContent += password[i];
    i++;
    if(i >= password.length) clearInterval(typingInterval);
  }, 30);
}

lengthInput.addEventListener('input', () => {
  updateSliderBackground();
  generatePassword();
});

generateBtn.addEventListener('click', generatePassword);

copyBtn.addEventListener('click', () => {
  navigator.clipboard.writeText(passwordBox.textContent);
  passwordBox.classList.add('flash-success');
  const originalText = copyBtn.innerHTML;
  copyBtn.innerHTML = '<i class="fa-solid fa-check mr-2 text-primary"></i> Skopiowano!';
  setTimeout(() => {
    passwordBox.classList.remove('flash-success');
    copyBtn.innerHTML = originalText;
  }, 1200);
});

updateSliderBackground();
generatePassword();
</script>
</body>
</html>
